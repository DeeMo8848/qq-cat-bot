<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📖 卡牌收集册</title>
<style>
  :root {
    --bg:#14100c; --panel:#221b16; --line:#3d2f24;
    --gold:#e3b95c; --gold2:#f3d48a; --text:#ece4d6; --muted:#a99b86;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #2a2018 0%, var(--bg) 60%);
    color: var(--text); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    min-height:100vh;
  }
  header {
    position: sticky; top:0; z-index:20;
    background: rgba(20,16,12,.85); backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  header h1 { font-size:20px; color:var(--gold2); letter-spacing:1px; }
  header .count { color:var(--muted); font-size:13px; }
  header .back {
    margin-left:auto; color:var(--muted); text-decoration:none; font-size:13px;
    border:1px solid var(--line); padding:7px 14px; border-radius:999px; transition:all .15s;
  }
  header .back:hover { color:var(--gold2); border-color:var(--gold); }

  /* 分类标签栏 */
  .tabs {
    position: sticky; top:63px; z-index:15;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    background: rgba(20,16,12,.92); backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
    padding:10px 24px;
  }
  .tabs button {
    padding:7px 16px; border-radius:999px; cursor:pointer; font-size:13px;
    background: var(--panel); color:var(--muted); border:1px solid var(--line);
    transition:all .15s; font-family:inherit; max-width:180px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tabs button:hover { color:var(--gold2); border-color:var(--gold); }
  .tabs button.on {
    background:linear-gradient(135deg,var(--gold2),var(--gold));
    color:#2b1d08; border-color:var(--gold); font-weight:700;
  }
  .tabs button.new { border-style:dashed; color:#b99c6a; }
  .tabs button .n { opacity:.7; font-size:11px; margin-left:5px; }

  /* 收藏集操作条（仅在收藏集分页显示） */
  .colbar {
    display:none; align-items:center; gap:12px; flex-wrap:wrap;
    max-width:1240px; margin:18px auto 0; padding:0 24px;
    color:var(--muted); font-size:13px;
  }
  .colbar.show { display:flex; }
  .colbar b { color:var(--gold2); }
  .colbar .del {
    margin-left:auto; cursor:pointer; font-size:13px; font-family:inherit;
    background:rgba(60,24,24,.6); color:#e8a0a0; border:1px solid #6b3030;
    padding:6px 14px; border-radius:999px; transition:all .15s;
  }
  .colbar .del:hover { background:#5a2424; color:#ffd0d0; }

  main { max-width:1240px; margin:0 auto; padding:28px 24px 60px; }
  .view { display:none; }
  .view.on { display:block; }

  /* 侧边信息框 */
  .info {
    position: fixed; right:0; top:0; bottom:0; width:300px; z-index:30;
    background: rgba(34,27,22,.93); border-left:1px solid var(--line);
    padding:28px 22px; transform: translateX(105%);
    transition: transform .28s ease; box-shadow: -12px 0 40px rgba(0,0,0,.45);
    overflow-y:auto;
  }
  .info.show { transform: translateX(0); }
  .info .thumb { width:100%; border-radius:12px; border:1px solid var(--gold); margin-bottom:16px; }
  .info h2 { color:var(--gold2); font-size:18px; margin-bottom:6px; }
  .info .badge { display:inline-block; font-size:12px; margin-bottom:14px; border-radius:999px; padding:3px 12px; font-weight:600; }
  .info .price { color:var(--gold2); font-size:14px; margin-bottom:12px; }
  .info .desc { font-size:14px; line-height:1.9; color:var(--text); white-space:pre-wrap; }
  .info .desc.empty { color:var(--muted); }
  .info .meta { margin-top:18px; font-size:12px; color:var(--muted); line-height:2; word-break:break-all; }
  .info .close {
    position:absolute; top:14px; right:14px; background:none; border:1px solid var(--line);
    color:var(--muted); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:13px;
  }
  .info .close:hover { color:var(--gold2); border-color:var(--gold); }

  /* 卡片网格 */
  .grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
    gap:22px;
  }
  .card { perspective:900px; cursor:pointer; position:relative; }
  .card .inner {
    transform-style: preserve-3d;
    transition: transform .18s ease-out;
    will-change: transform;
  }
  .thumbwrap { position:relative; }
  .card img {
    width:100%; aspect-ratio:3/4; object-fit:cover;
    border-radius:12px; border:1px solid var(--line);
    display:block; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    transition: border-color .2s, box-shadow .2s;
  }
  .card:hover img { border-color:var(--gold); box-shadow: 0 16px 44px rgba(227,185,92,.22); }
  .card .rarity {
    position:absolute; top:8px; left:8px; z-index:2;
    font-size:11px; font-weight:700; border-radius:999px; padding:2px 10px; letter-spacing:1px;
  }
  .card .colbtn {
    position:absolute; top:8px; right:8px; z-index:3;
    width:28px; height:28px; border-radius:50%; cursor:pointer;
    background:rgba(20,12,8,.8); border:1px solid var(--line); color:var(--gold2);
    font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;
    transition:all .15s;
  }
  .card .colbtn:hover { border-color:var(--gold); background:rgba(60,44,20,.95); }
  .card .colbtn.member { border-color:var(--gold); background:rgba(90,66,24,.9); }
  .card .name {
    margin-top:8px; text-align:center; font-size:13px; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card:hover .name { color:var(--gold2); }
  .card .price { text-align:center; font-size:12px; color:#8a7a62; margin-top:2px; }
  .empty { text-align:center; color:var(--muted); padding:80px 0; font-size:15px; }

  /* 品级徽章配色 */
  .r-cu  { background:linear-gradient(135deg,#d9a06b,#8f5a2a); color:#2b1d08; }
  .r-yin { background:linear-gradient(135deg,#e8f0f6,#8fa3b5); color:#1d2b33; }
  .r-jin { background:linear-gradient(135deg,#f7e3ad,#c99a3f); color:#2b1d08; }
  .r-hong {
    background:linear-gradient(90deg,#ff6a6a,#ff9f4d,#ffe066,#7ee787,#64c5ff,#c792ea,#ff6a9c,#ff6a6a);
    background-size:400% 100%; animation: rainbow 3s linear infinite; color:#1a1205;
  }
  @keyframes rainbow { to { background-position:400% 0; } }

  /* 素材包分页 */
  .matcat { margin-bottom:26px; }
  .matcat h3 {
    font-size:15px; color:var(--gold2); margin-bottom:12px; font-weight:600;
    display:flex; align-items:baseline; gap:8px;
  }
  .matcat h3 .n { font-size:12px; color:var(--muted); font-weight:400; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip {
    font-size:13px; color:var(--gold2); background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:6px 15px;
  }
  .chip.glow { border-color:#6b5a2a; }
  .matempty { color:var(--muted); font-size:13px; }

  /* 收藏集弹窗 */
  .pop {
    position:fixed; inset:0; z-index:45; display:none;
    background: rgba(8,6,4,.82); backdrop-filter: blur(6px);
    align-items:center; justify-content:center; padding:24px;
  }
  .pop.show { display:flex; }
  .pop .box {
    width:min(420px, 94vw); max-height:86vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--gold); border-radius:16px;
    padding:22px; box-shadow:0 20px 80px rgba(0,0,0,.7);
  }
  .pop h3 { color:var(--gold2); font-size:16px; margin-bottom:4px; }
  .pop .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .poprow {
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    margin-bottom:8px; font-size:14px; transition:all .15s;
  }
  .poprow:hover { border-color:var(--gold); background:#2c231a; }
  .poprow input { width:17px; height:17px; accent-color:var(--gold); cursor:pointer; }
  .poprow .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .poprow .ct { color:var(--muted); font-size:12px; }
  .pop .newline { display:flex; gap:8px; margin-top:14px; }
  .pop .newline input {
    flex:1; background:#1b1510; border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:9px 12px; font-size:13px; font-family:inherit;
  }
  .pop .newline input:focus { outline:none; border-color:var(--gold); }
  .pop .newline button {
    cursor:pointer; font-family:inherit; font-size:13px; padding:9px 16px;
    border-radius:10px; border:1px solid var(--gold); color:#2b1d08;
    background:linear-gradient(135deg,var(--gold2),var(--gold)); white-space:nowrap;
  }
  .pop .done {
    width:100%; margin-top:16px; cursor:pointer; font-family:inherit; font-size:14px;
    padding:10px; border-radius:10px; background:rgba(34,27,22,.9);
    color:var(--gold2); border:1px solid var(--line);
  }
  .pop .done:hover { border-color:var(--gold); }
  .pop .tip { color:var(--muted); font-size:12px; margin-top:10px; min-height:16px; }
  .pop .tip.err { color:#e8a0a0; }

  /* 放大弹窗 */
  .modal {
    position:fixed; inset:0; z-index:40; display:none;
    background: rgba(8,6,4,.82); backdrop-filter: blur(6px);
    align-items:center; justify-content:center; padding:30px;
  }
  .modal.show { display:flex; }
  .modal .frame {
    width:min(560px, 94vw); height:min(760px, 92vh);
    background:#000; border-radius:16px; border:1px solid var(--gold);
    overflow:hidden; box-shadow: 0 20px 80px rgba(0,0,0,.7); position:relative;
  }
  .modal iframe { width:100%; height:100%; border:0; }
  .modal .close {
    position:absolute; top:-14px; right:-14px; z-index:2;
    width:36px; height:36px; border-radius:50%;
    background:var(--gold); color:#2b1d08; border:none; font-size:16px; cursor:pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .modal .modalbar {
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    display:flex; gap:10px; justify-content:center; padding:12px;
    background: linear-gradient(transparent, rgba(8,6,4,.92));
  }
  .modal .modalbar a, .modal .modalbar button {
    padding:8px 18px; border-radius:999px; cursor:pointer; font-size:13px;
    background: rgba(34,27,22,.9); color:var(--gold2); border:1px solid var(--line);
    transition:all .15s; text-decoration:none;
  }
  .modal .modalbar button:hover, .modal .modalbar a:hover { border-color:var(--gold); background:#32281c; }
  .modal .modalbar button.on {
    background:linear-gradient(135deg,var(--gold2),var(--gold)); color:#2b1d08; border-color:var(--gold);
  }
  .modal .hintbar {
    position:absolute; left:0; right:0; bottom:52px;
    background: linear-gradient(transparent, rgba(8,6,4,.9));
    color:var(--muted); font-size:12px; text-align:center; padding:30px 0 12px;
    pointer-events:none;
  }
  .modal .hintbar .web-tip {
    display:block; font-size:11px; color:#b99c6a; margin-top:4px;
    background:rgba(34,27,22,.75); border:1px dashed var(--line);
    border-radius:8px; padding:4px 8px; margin:6px 12px 0; line-height:1.7;
    pointer-events:auto;
  }
  .modal .hintbar .web-tip a {
    color:var(--gold2); text-decoration:underline; margin:0 4px;
  }
</style>
</head>
<body>
<header>
  <h1>📖 卡牌收集册</h1>
  <span class="count" id="count"></span>
  <a class="back" href="/market">🏪 卡牌市场 →</a>
</header>

<div class="tabs" id="tabs"></div>
<div class="colbar" id="colbar">
  <span>收藏集：<b id="colbarName"></b></span>
  <button class="del" id="colDel">🗑️ 删除该收藏集</button>
</div>

<main>
  <div class="view on" id="view-all">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">还没有卡牌喵～ 回 QQ 引用图片发「卡牌制作 卡名」做一张吧</div>
  </div>
  <div class="view" id="view-materials">
    <div id="matBox"></div>
  </div>
</main>

<aside class="info" id="info">
  <button class="close" id="infoClose">✕</button>
  <img class="thumb" id="infoImg" alt="">
  <h2 id="infoName"></h2>
  <span class="badge" id="infoBadge"></span>
  <div class="price" id="infoPrice"></div>
  <div class="desc" id="infoDesc"></div>
  <div class="meta" id="infoMeta"></div>
</aside>

<!-- 收藏集管理弹窗 -->
<div class="pop" id="pop">
  <div class="box">
    <h3>🗂️ 收藏「<span id="popCardName"></span>」</h3>
    <div class="sub">勾选即加入对应收藏集，取消勾选即移出</div>
    <div id="popList"></div>
    <div class="newline">
      <input id="popNewName" maxlength="12" placeholder="新建收藏集昵称">
      <button id="popNewBtn">新建并加入</button>
    </div>
    <div class="tip" id="popTip"></div>
    <button class="done" id="popDone">完成</button>
  </div>
</div>

<div class="modal" id="modal">
  <button class="close" id="modalClose">✕</button>
  <div class="frame">
    <iframe id="modalFrame" src="about:blank"></iframe>
    <div class="modalbar">
      <button id="modalFlip" disabled>🔄 翻面</button>
      <button id="modalSpin" disabled>🌀 自动旋转</button>
      <a id="modalShare" href="#" target="_blank">🔗 分享</a>
    </div>
    <div class="hintbar">🖱️ 拖拽旋转 · 滚轮缩放 · 双击翻面
      <span class="web-tip" id="webTip" style="display:none">📱 看不到卡牌（黑屏/空白）？QQ 内置浏览器不支持 3D 渲染，点<a id="openBrowser" href="#" target="_blank">这里用浏览器打开</a>，或复制分享链接</span>
    </div>
  </div>
</div>

<script>
const RARITY = {
  '铜': { cls: 'r-cu',  label: '🥉 铜' },
  '银': { cls: 'r-yin', label: '🥈 银' },
  '金': { cls: 'r-jin', label: '🥇 金' },
  '虹': { cls: 'r-hong',label: '🌈 虹' },
};
const USER_KEY = location.pathname.split('/').filter(Boolean)[1] || '';
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const info = document.getElementById('info');
const tabs = document.getElementById('tabs');
const colbar = document.getElementById('colbar');
let allCards = [];
let byKey = {};
let collections = [];
let activeView = 'all';        // 'all' | 'materials' | 'col:<cid>'
let currentCard = null;
let spinning = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
}
function badge(c) {
  const r = RARITY[c.rarity] || RARITY['铜'];
  return '<span class="rarity ' + r.cls + '">' + r.label + '</span>';
}
function activeCid() {
  return activeView.startsWith('col:') ? activeView.slice(4) : null;
}
function cardInAnyCollection(key) {
  return collections.some(c => c.cards.indexOf(key) >= 0);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  return await r.json();
}

// ---------- 加载 ----------
async function load() {
  try {
    const d = await api('/api/album/' + encodeURIComponent(USER_KEY));
    if (d.ok) allCards = d.cards || [];
  } catch (e) { allCards = []; }
  byKey = {};
  allCards.forEach(c => { byKey[c.cardKey] = c; });
  await loadCollections();
  renderTabs();
  renderGrid();
}

async function loadCollections() {
  try {
    const d = await api('/api/album/' + encodeURIComponent(USER_KEY) + '/collections');
    if (d.ok) collections = d.collections || [];
  } catch (e) { collections = []; }
}

// ---------- 标签栏 ----------
function renderTabs() {
  tabs.innerHTML = '';
  const all = mkTab('all', '🗂️ 全部', allCards.length);
  all.classList.add('on');
  activeView === 'all' && all.classList.add('on');
  tabs.appendChild(all);
  collections.forEach(c => {
    const b = mkTab('col:' + c.cid, '📁 ' + c.name, c.cards.length);
    b.classList.add('col');
    if (activeView === 'col:' + c.cid) b.classList.add('on');
    tabs.appendChild(b);
  });
  tabs.appendChild(mkTab('new', '＋ 新建收藏集', null, 'new'));
  tabs.appendChild(mkTab('materials', '🎨 素材包', null));
  // 修正「全部」高亮：仅当 activeView 为 all
  Array.prototype.forEach.call(tabs.children, el => {
    el.classList.toggle('on', el.dataset.view === activeView);
  });
  // 收藏集操作条
  const cid = activeCid();
  if (cid) {
    const c = collections.find(x => x.cid === cid);
    document.getElementById('colbarName').textContent = c ? c.name : '';
    colbar.classList.add('show');
  } else {
    colbar.classList.remove('show');
  }
}

function mkTab(view, label, n, extra) {
  const b = document.createElement('button');
  b.dataset.view = view;
  if (extra) b.classList.add(extra);
  b.innerHTML = esc(label) + (n != null ? '<span class="n">' + n + '</span>' : '');
  b.addEventListener('click', () => {
    if (view === 'new') { openPop(null); return; }
    activeView = view;
    renderTabs();
    renderGrid();
    if (view === 'materials') loadMaterials();
  });
  return b;
}

// ---------- 卡片网格 ----------
function renderGrid() {
  const cid = activeCid();
  let list = allCards;
  if (cid) {
    const c = collections.find(x => x.cid === cid);
    const keys = c ? c.cards : [];
    list = keys.map(k => byKey[k]).filter(Boolean);
  }
  document.getElementById('view-all').classList.toggle('on', activeView !== 'materials');
  document.getElementById('view-materials').classList.toggle('on', activeView === 'materials');

  document.getElementById('count').textContent = allCards.length ? '共 ' + allCards.length + ' 张' : '';
  grid.innerHTML = '';
  empty.style.display = list.length ? 'none' : 'block';
  if (activeView === 'materials') return;
  if (cid) {
    const c = collections.find(x => x.cid === cid);
    empty.textContent = '这个收藏集还是空的喵～ 点卡片右上角 🗂️ 把卡加进来吧';
  } else {
    empty.textContent = '还没有卡牌喵～ 回 QQ 引用图片发「卡牌制作 卡名」做一张吧';
  }
  list.forEach(c => grid.appendChild(makeCard(c)));
}

function makeCard(c) {
  const wrap = document.createElement('div');
  wrap.className = 'card';
  const member = cardInAnyCollection(c.cardKey);
  wrap.innerHTML = '<div class="inner"><div class="thumbwrap">' + badge(c) +
    '<button class="colbtn' + (member ? ' member' : '') + '" title="加入/移出收藏集">🗂️</button>' +
    '<img src="' + esc(c.card_png) + '" alt="" loading="lazy"></div>' +
    '<div class="name">' + esc(c.name) + '</div>' +
    '<div class="price">价值 ' + esc(c.price) + ' 喵币' +
    (c.status === 'market' ? ' · 在市场中' : '') + '</div></div>';
  const inner = wrap.querySelector('.inner');
  wrap.addEventListener('mousemove', e => {
    const r = wrap.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    inner.style.transform = 'rotateY(' + (px * 12).toFixed(2) + 'deg) rotateX(' + (-py * 10).toFixed(2) + 'deg) translateZ(6px)';
  });
  wrap.addEventListener('mouseleave', () => { inner.style.transform = ''; });
  wrap.addEventListener('mouseenter', () => showInfo(c));
  wrap.addEventListener('mouseleave', () => info.classList.remove('show'));
  wrap.addEventListener('click', () => openModal(c));
  wrap.querySelector('.colbtn').addEventListener('click', e => {
    e.stopPropagation();
    openPop(c);
  });
  return wrap;
}

function showInfo(c) {
  currentCard = c;
  document.getElementById('infoImg').src = c.card_png;
  document.getElementById('infoName').textContent = c.name;
  const b = RARITY[c.rarity] || RARITY['铜'];
  const badgeEl = document.getElementById('infoBadge');
  badgeEl.textContent = b.label;
  badgeEl.className = 'badge ' + b.cls;
  document.getElementById('infoPrice').textContent =
    '价值 ' + c.price + ' 喵币' + (c.status === 'market' ? '（市场中）' : '');
  const desc = document.getElementById('infoDesc');
  if (c.desc) { desc.textContent = c.desc; desc.classList.remove('empty'); }
  else { desc.textContent = '（这张卡还没有描述文字）'; desc.classList.add('empty'); }
  const inCols = collections.filter(x => x.cards.indexOf(c.cardKey) >= 0).map(x => x.name);
  document.getElementById('infoMeta').innerHTML =
    '<b>卡牌 ID</b>　' + esc(c.cardKey) + '<br><b>类型</b>　' +
    ({ none:'无文本型', transparent:'特殊文本型', boxed:'文本型' }[c.text_type] || c.text_type) +
    '<br><b>收藏集</b>　' + (inCols.length ? esc(inCols.join('、')) : '未收藏');
  info.classList.add('show');
}

// ---------- 收藏集弹窗 ----------
const pop = document.getElementById('pop');
let popCard = null;

function openPop(card) {
  popCard = card;
  document.getElementById('popCardName').textContent = card ? card.name : '（新收藏集）';
  document.getElementById('popNewName').value = '';
  setPopTip('');
  renderPopList();
  pop.classList.add('show');
}

function setPopTip(msg, err) {
  const t = document.getElementById('popTip');
  t.textContent = msg || '';
  t.classList.toggle('err', !!err);
}

function renderPopList() {
  const box = document.getElementById('popList');
  box.innerHTML = '';
  if (!collections.length) {
    box.innerHTML = '<div class="matempty" style="margin-bottom:8px">还没有收藏集，先在下面新建一个吧</div>';
  }
  collections.forEach(c => {
    const has = popCard ? c.cards.indexOf(popCard.cardKey) >= 0 : false;
    const row = document.createElement('label');
    row.className = 'poprow';
    row.innerHTML = '<input type="checkbox"' + (has ? ' checked' : '') +
      (popCard ? '' : ' disabled') + '><span class="nm">' + esc(c.name) +
      '</span><span class="ct">' + c.cards.length + ' 张</span>';
    if (popCard) {
      row.querySelector('input').addEventListener('change', async e => {
        const on = e.target.checked;
        const d = await api('/api/album/' + encodeURIComponent(USER_KEY) + '/collection', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: on ? 'add' : 'remove', cid: c.cid, cardKey: popCard.cardKey })
        });
        if (!d.ok) { setPopTip(d.msg || '操作失败', true); e.target.checked = !on; return; }
        setPopTip(on ? '已加入「' + c.name + '」' : '已移出「' + c.name + '」');
        await loadCollections();
        renderTabs();
        renderGrid();
        renderPopList();
      });
    }
    box.appendChild(row);
  });
}

document.getElementById('popNewBtn').addEventListener('click', async () => {
  const name = document.getElementById('popNewName').value.trim();
  if (!name) { setPopTip('请先输入收藏集昵称', true); return; }
  const d = await api('/api/album/' + encodeURIComponent(USER_KEY) + '/collection', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'create', name })
  });
  if (!d.ok) { setPopTip(d.msg || '创建失败', true); return; }
  if (popCard) {
    await api('/api/album/' + encodeURIComponent(USER_KEY) + '/collection', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'add', cid: d.cid, cardKey: popCard.cardKey })
    });
  }
  document.getElementById('popNewName').value = '';
  await loadCollections();
  renderTabs();
  renderGrid();
  renderPopList();
  setPopTip('已创建「' + name + '」' + (popCard ? '并加入' : ''));
});
document.getElementById('popDone').addEventListener('click', () => pop.classList.remove('show'));
pop.addEventListener('click', e => { if (e.target === e.currentTarget) pop.classList.remove('show'); });

document.getElementById('colDel').addEventListener('click', async () => {
  const cid = activeCid();
  const c = collections.find(x => x.cid === cid);
  if (!c) return;
  if (!confirm('确定删除收藏集「' + c.name + '」吗？（卡牌本身不会被删除）')) return;
  const d = await api('/api/album/' + encodeURIComponent(USER_KEY) + '/collection', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'delete', cid })
  });
  if (!d.ok) return;
  activeView = 'all';
  await loadCollections();
  renderTabs();
  renderGrid();
});

// ---------- 素材包分页 ----------
let materialsLoaded = false;
async function loadMaterials() {
  if (materialsLoaded) return;
  materialsLoaded = true;
  const box = document.getElementById('matBox');
  box.innerHTML = '<div class="matempty">加载中…</div>';
  let cats = [];
  try {
    const d = await api('/api/album/' + encodeURIComponent(USER_KEY) + '/materials');
    if (d.ok) cats = d.cats || [];
  } catch (e) {}
  box.innerHTML = '';
  const total = cats.reduce((s, c) => s + c.items.length, 0);
  if (!total) {
    box.innerHTML = '<div class="matempty">还没有解锁任何素材喵～ 回 QQ 发「素材包」查看可买素材</div>';
    return;
  }
  cats.forEach(cat => {
    const sec = document.createElement('div');
    sec.className = 'matcat';
    const chips = cat.items.length
      ? cat.items.map(n => '<span class="chip' + (cat.cat === 'glow' ? ' glow' : '') + '">' + esc(n) + '</span>').join('')
      : '<span class="matempty">未解锁</span>';
    sec.innerHTML = '<h3>' + esc(cat.cn) + '<span class="n">已解锁 ' + cat.items.length + ' 种</span></h3>' +
      '<div class="chips">' + chips + '</div>';
    box.appendChild(sec);
  });
}

// ---------- 放大弹窗 ----------
function openModal(c) {
  currentCard = c;
  const frame = document.getElementById('modalFrame');
  const flipBtn = document.getElementById('modalFlip');
  const spinBtn = document.getElementById('modalSpin');
  spinning = false;
  spinBtn.classList.remove('on');
  spinBtn.textContent = '🌀 自动旋转';
  flipBtn.disabled = true;
  spinBtn.disabled = true;
  frame.onload = () => {
    flipBtn.disabled = !(frame.contentWindow && frame.contentWindow.__cardAPI);
    spinBtn.disabled = !(frame.contentWindow && frame.contentWindow.__cardAPI);
  };
  const webTip = document.getElementById('webTip');
  webTip.style.display = c.has_webcard ? 'block' : 'none';
  document.getElementById('openBrowser').href = c.has_webcard ? c.card_html : '#';
  document.getElementById('modalShare').href = '/card/' + c.cardKey;
  frame.src = c.has_webcard ? c.card_html : c.card_png;
  document.getElementById('modal').classList.add('show');
}
function closeModal() {
  const frame = document.getElementById('modalFrame');
  if (spinning && frame.contentWindow && frame.contentWindow.__cardAPI) {
    frame.contentWindow.__cardAPI.setAutoRotate(false);
  }
  spinning = false;
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modalFrame').src = 'about:blank';
}

document.getElementById('infoClose').addEventListener('click', () => info.classList.remove('show'));
document.getElementById('modalFlip').addEventListener('click', () => {
  const f = document.getElementById('modalFrame');
  if (f.contentWindow && f.contentWindow.__cardAPI) f.contentWindow.__cardAPI.flipCard();
});
document.getElementById('modalSpin').addEventListener('click', () => {
  const f = document.getElementById('modalFrame');
  const btn = document.getElementById('modalSpin');
  if (!f.contentWindow || !f.contentWindow.__cardAPI) return;
  spinning = !spinning;
  f.contentWindow.__cardAPI.setAutoRotate(spinning);
  btn.classList.toggle('on', spinning);
  btn.textContent = spinning ? '🌀 自动旋转中…' : '🌀 自动旋转';
});
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); info.classList.remove('show'); pop.classList.remove('show'); }
});

load();
</script>
