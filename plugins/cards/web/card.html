<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🃏 卡牌预览</title>
<style>
  :root {
    --bg:#14100c; --panel:#221b16; --line:#3d2f24;
    --gold:#e3b95c; --gold2:#f3d48a; --text:#ece4d6; --muted:#a99b86;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #2a2018 0%, var(--bg) 60%);
    color: var(--text); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header {
    background: rgba(20,16,12,.85); backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  header h1 { font-size:20px; color:var(--gold2); }
  header .badge { font-size:13px; font-weight:700; border-radius:999px; padding:3px 14px; }
  header .price { color:var(--muted); font-size:14px; }
  header .owner { color:var(--muted); font-size:13px; margin-left:auto; }
  header .back {
    color:var(--muted); text-decoration:none; font-size:13px;
    border:1px solid var(--line); padding:7px 14px; border-radius:999px; transition:all .15s;
  }
  header .back:hover { color:var(--gold2); border-color:var(--gold); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:28px; }
  .stage { width:min(460px, 92vw); }
  .stage .frame {
    width:100%; aspect-ratio:3/4; background:#000; border-radius:16px;
    border:1px solid var(--gold); overflow:hidden; box-shadow: 0 20px 80px rgba(0,0,0,.7);
  }
  .stage iframe { width:100%; height:100%; border:0; }
  .stage img { width:100%; height:100%; object-fit:contain; display:block; }
  .stage .hint { color:var(--muted); font-size:12px; text-align:center; padding-top:12px; }
  .stage .web-hint {
    margin-top:14px; padding:12px 14px; border:1px dashed var(--line);
    border-radius:10px; background:rgba(34,27,22,.55); text-align:center;
    color:var(--muted); font-size:12px; line-height:1.8;
  }
  .stage .web-hint .act { display:inline-block; margin-top:4px; }
  .stage .web-hint a, .stage .web-hint button {
    padding:7px 14px; margin:4px 4px 0; border-radius:999px; cursor:pointer;
    font-size:12px; background:#32281c; color:var(--gold2);
    border:1px solid var(--gold); text-decoration:none; font-family:inherit;
  }
  .stage .web-hint a:hover, .stage .web-hint button:hover { background:#3f3020; }
  .desc { max-width:640px; margin:0 auto; padding:6px 24px 40px; text-align:center; color:var(--text); font-size:14px; line-height:1.9; white-space:pre-wrap; }
  .desc.empty { color:var(--muted); }

  .r-cu  { background:linear-gradient(135deg,#d9a06b,#8f5a2a); color:#2b1d08; }
  .r-yin { background:linear-gradient(135deg,#e8f0f6,#8fa3b5); color:#1d2b33; }
  .r-jin { background:linear-gradient(135deg,#f7e3ad,#c99a3f); color:#2b1d08; }
  .r-hong {
    background:linear-gradient(90deg,#ff6a6a,#ff9f4d,#ffe066,#7ee787,#64c5ff,#c792ea,#ff6a9c,#ff6a6a);
    background-size:400% 100%; animation: rainbow 3s linear infinite; color:#1a1205;
  }
  @keyframes rainbow { to { background-position:400% 0; } }
</style>
</head>
<body>
<header>
  <h1 id="title">🃏 卡牌</h1>
  <span class="badge" id="badge" style="display:none"></span>
  <span class="price" id="price"></span>
  <span class="owner" id="owner"></span>
  <a class="back" href="/market">🏪 市场</a>
</header>
<main>
  <div class="stage">
    <div class="frame" id="frame"></div>
    <div class="hint">🖱️ 拖拽旋转 · 滚轮缩放 · 双击翻面</div>
    <div class="web-hint" id="webHint" style="display:none">
      📱 若这里看不到 3D 卡牌（黑屏/空白），是 QQ 内置浏览器不支持 WebGL 渲染，请用手机或电脑浏览器打开查看。<br>
      <span class="act">
        <a id="openBrowser" href="#">🌐 用浏览器打开</a>
        <button id="copyLink" type="button">📋 复制链接</button>
      </span>
    </div>
  </div>
</main>
<div class="desc empty" id="desc"></div>

<script>
const RARITY = {
  '铜': { cls:'r-cu', label:'🥉 铜' }, '银': { cls:'r-yin', label:'🥈 银' },
  '金': { cls:'r-jin', label:'🥇 金' }, '虹': { cls:'r-hong', label:'🌈 虹' },
};
async function load() {
  const key = location.pathname.split('/').filter(Boolean)[1] || '';
  let c = null;
  try {
    const r = await fetch('/api/card/' + encodeURIComponent(key));
    const d = await r.json();
    if (d.ok) c = d.card;
  } catch (e) {}
  if (!c) {
    document.getElementById('title').textContent = '🃏 卡牌不存在或已销毁';
    return;
  }
  document.title = '🃏 ' + c.name;
  document.getElementById('title').textContent = '🃏 ' + c.name;
  const b = RARITY[c.rarity] || RARITY['铜'];
  const badge = document.getElementById('badge');
  badge.textContent = b.label;
  badge.className = 'badge ' + b.cls;
  badge.style.display = 'inline-block';
  document.getElementById('price').textContent = '价值 ' + c.price + ' 喵币';
  document.getElementById('owner').textContent = c.owner_nick ? ('拥有者：' + c.owner_nick) : '';
  const frame = document.getElementById('frame');
  if (c.has_webcard) {
    frame.innerHTML = '<iframe src="' + c.card_html + '"></iframe>';
    const hint = document.getElementById('webHint');
    hint.style.display = 'block';
    document.getElementById('openBrowser').href = c.card_html;
  } else {
    frame.innerHTML = '<img src="' + c.card_png + '" alt="' + c.name + '">';
  }
  const desc = document.getElementById('desc');
  if (c.desc) { desc.textContent = c.desc; desc.classList.remove('empty'); }
  else desc.textContent = '';
}
document.getElementById('copyLink').addEventListener('click', () => {
  const url = document.getElementById('openBrowser').href;
  const done = () => alert('链接已复制，粘贴到系统浏览器打开即可查看 3D 卡牌喵～');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => { fallbackCopy(url); done(); });
  } else { fallbackCopy(url); done(); }
});
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
load();
</script>
</body>
</html>
